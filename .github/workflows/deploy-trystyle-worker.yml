name: Deploy TryStyle Cloudflare API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker and migrate D1
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          if grep -q "REPLACE_WITH_REAL_D1_DATABASE_ID" wrangler.toml; then
            echo "Replace D1 database ID before deployment"; exit 1
          fi
          npm install
          npx wrangler d1 migrations apply trystyle-ai --remote
          npx wrangler deploy
