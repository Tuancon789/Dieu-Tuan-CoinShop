name: Deploy TryStyle Server and Ready-to-Use APK
on:
  workflow_dispatch:
  push:
    branches: [trystyle-ai-online]
    paths:
      - '.github/workflows/deploy-trystyle-worker.yml'
      - 'server/scripts/**'
      - 'server/wrangler.toml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate code and prepare account D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          FASHN_API_KEY: ${{ secrets.FASHN_API_KEY }}
        run: |
          node --check server/src/index.js
          node --check server/scripts/bootstrap-cloudflare.mjs
          node --check server/scripts/verify-deployment.mjs
          node server/scripts/bootstrap-cloudflare.mjs
      - name: Install Wrangler
        working-directory: server
        run: npm install
      - name: Run D1 migrations on deployed database
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply trystyle-ai --remote
      - name: Replace old TikXu Worker with TryStyle API (legacy login will stop working)
        # This step only runs after explicit Cloudflare credential setup.
        # Source ZIPs and any legacy KV/D1 data are not deleted.
        
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --secrets-file "$TRYSTYLE_SECRET_FILE"
          rm -f "$TRYSTYLE_SECRET_FILE"
      - name: Confirm API and activate reserved ADM account
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: node server/scripts/verify-deployment.mjs
      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK with verified API address embedded
        env:
          TRY_STYLE_API_URL: ${{ env.TRYSTYLE_API_URL }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TryStyleAI-Online-Connected-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Deployment address summary
        run: |
          echo "TryStyle AI API: $TRYSTYLE_API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "ADM activated in D1; password remains in GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"
          echo "The uploaded APK contains the server URL automatically." >> "$GITHUB_STEP_SUMMARY"
