name: Build TryStyle AI Online APK
on:
  workflow_dispatch:
  push:
    branches: [trystyle-ai-online]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate backend JavaScript and D1 SQL migration
        run: |
          node --check server/src/index.js
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect(":memory:")
          db.executescript(open("server/migrations/0001_initial.sql", encoding="utf8").read())
          expected={"users","sessions","tryons"}
          tables={x[0] for x in db.execute("select name from sqlite_master where type='table'")}
          assert expected.issubset(tables), tables
          print("Backend JS and D1 schema validation passed")
          PY
      - name: Install Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TryStyleAI-Online-v1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
